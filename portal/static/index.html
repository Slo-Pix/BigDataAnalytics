<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <nav id="nav">
      <a href="#overview" data-page="overview"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</a>
      <a href="#stream" data-page="stream"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Live stream</a>
      <a href="#kafka" data-page="kafka"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11 15.7 7M8.3 13l7.4 4"/></svg>Kafka</a>
      <a href="#dataset" data-page="dataset"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></svg>Dataset</a>
      <a href="#sql" data-page="sql"><svg viewBox="0 0 24 24"><path d="m5 8 4 4-4 4M12 17h7"/></svg>Spark SQL</a>
      <a href="#findings" data-page="findings"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Findings</a>
      <a href="#tools" data-page="tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-2-2 1.3-1.3a4 4 0 0 0-5-5L3 9 9 3l2 2z"/></svg>Tools</a>
    </nav>
    <div class="promo">
      <b>Live demo</b>
      <p id="demoText">Stream the 2,000 busiest torrents through Kafka and Spark, right now.</p>
      <button id="demoBtn" class="btn light">Start demo</button>
    </div>
    <div class="side-links">
      <a href="/report.pdf" target="_blank"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg>Report (PDF)</a>
      <a href="https://claude.ai/artifact/7xzUmdV3cTZNCTbcB7qnU9" target="_blank"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Slides</a>
      <a href="http://localhost:3000" target="_blank"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Grafana</a>
    </div>
  </aside>
  <main>
    <header class="top">
      <div>
        <h1 id="title">Overview</h1>
      </div>
      <div class="top-right">
        <span id="livePill" class="pill"><i></i><span>checking…</span></span>
        <span class="pill ghost" id="clock"></span>
      </div>
    </header>
    <section id="page"></section>
  </main>
</div>
<div id="lightbox" hidden><img alt=""></div>
<script src="app.js"></script>
</body>
</html>
