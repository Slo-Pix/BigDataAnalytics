# Speed + serving layer for the torrent analytics project.
#   docker compose -f infra/docker-compose.yml up -d                       # kafka, postgres, grafana
#   docker compose -f infra/docker-compose.yml --profile scraper up -d     # + 24/7 tracker scraper
#   docker compose -f infra/docker-compose.yml --profile hdfs up -d        # + single-node HDFS
name: torrent-bda

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168   # keep a week so the stream job can replay
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # store the log on the kafka-data volume
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
          --topic tracker.scrapes --partitions 6 --replication-factor 1
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: torrent-bda
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on: {kafka: {condition: service_healthy}}
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: torrent
      POSTGRES_USER: bda
      POSTGRES_PASSWORD: bda
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bda -d torrent"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped

  scraper:
    profiles: [scraper]
    build: {context: .., dockerfile: infra/scraper.Dockerfile}
    container_name: scraper
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      python -m ingest.tracker_scraper --hashes /data/raw/scrape_targets/infohashes.txt
      --kafka kafka:19092 --interval ${SCRAPE_INTERVAL:-60}
    environment: {BDA_DATA: /data}
    volumes: [../dataset:/data]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    restart: unless-stopped

  # Tier 2: every other torrent the full catalog scan found alive, scraped back-to-back (~20 min/round)
  # while `scraper` keeps the original alive panel at ~3 min/round. Same Kafka topic, own JSONL backup.
  scraper-wide:
    profiles: [scraper]
    build: {context: .., dockerfile: infra/scraper.Dockerfile}
    container_name: scraper-wide
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      python -m ingest.tracker_scraper --hashes /data/raw/scrape_targets/wide.txt
      --kafka kafka:19092 --interval 60 --jsonl-dir /data/stream/jsonl_wide
    environment: {BDA_DATA: /data}
    volumes: [../dataset:/data]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    restart: unless-stopped

  # Classroom demo: the ~2,000 busiest torrents every ~15 s into a separate topic (demo/live_demo.sh)
  scraper-demo:
    profiles: [demo]
    build: {context: .., dockerfile: infra/scraper.Dockerfile}
    container_name: scraper-demo
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      python -m ingest.tracker_scraper --hashes /data/raw/scrape_targets/demo.txt
      --kafka kafka:19092 --topic tracker.scrapes.demo --interval 15 --jsonl-dir /data/stream/jsonl_demo
    environment: {BDA_DATA: /data}
    volumes: [../dataset:/data]
    restart: "no"

  namenode:
    profiles: [hdfs]
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports: ["9870:9870", "8020:8020"]
    env_file: ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    volumes: [hdfs-name:/tmp/hadoop-root/dfs/name]
    restart: unless-stopped

  datanode:
    profiles: [hdfs]
    image: apache/hadoop:3.4.1
    container_name: datanode
    command: ["hdfs", "datanode"]
    env_file: ./hadoop.env
    volumes: [hdfs-data:/tmp/hadoop-hadoop/dfs/data]
    depends_on: [namenode]
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  grafana-data:
  hdfs-name:
  hdfs-data:
